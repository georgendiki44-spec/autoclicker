name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove stale Buildozer state
        run: rm -rf .buildozer

      - name: Validate Python syntax
        run: python3 -m py_compile main.py clickmaster.py

      - name: Build APK
        run: |
          printf 'y\n' | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-apk
          path: ./bin/*.apk
          if-no-files-found: error
